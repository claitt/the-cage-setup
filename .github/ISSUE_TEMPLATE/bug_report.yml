name: Bug report
description: Something went wrong while running the installer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach the log: it is `installer-log.txt`,
        in the same folder as `CageSetup.exe`.

        Problems with the game, the server or the emulator are better reported to
        their own projects (see the links on the new issue page).
  - type: input
    id: version
    attributes:
      label: Cage Setup version
      description: Shown in the window title, or as "Version" by `-Console`.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2, 64-bit"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the last part of `installer-log.txt`. Remove any personal path you do not want to share.
      render: text
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Was the installer running as administrator?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the latest release.
          required: true
        - label: I have read the troubleshooting section of the README.
          required: true
